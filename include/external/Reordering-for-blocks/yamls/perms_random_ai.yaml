variables:
  suite:
    - ai
    - extended
    - standard
  mtx:
    map:
      ai: /data/matrices/datasets/ai_matrices.txt
      extended: /data/matrices/datasets/matrices_extended.txt
      standard: /data/matrices/datasets/matrices_list_filtered.txt
preprocess: |
    micromamba activate reorder_env

# NOTE (AI matrices):
#   * Every step of every approach is wrapped in `timeout 30m` to impose a hard
#     30-minute wall-clock bound, because the SPRINkLE AI matrices can be large.
#     A timed-out run exits with code 124, which SbatchMan records as FAILED.
#   * The base random1D scramble is applied with `--perm-type ROW` (NOT the
#     SYMMETRIC used for the square SuiteSparse set): ~98% of the AI matrices
#     are NON-SQUARE, and a SYMMETRIC permutation is only defined for square
#     matrices (MtxPerm/utils.py raises for m != n). random1D is a row
#     permutation, so ROW is the correct, always-valid choice here.
#   * Each command ends with `rc=$?; rm -f $temp_mtx; (exit $rc)` so the exit
#     code of the timed algorithm (124 on timeout) is what SbatchMan records,
#     while the temp matrix is always cleaned up. (The plain `; rm -f ...` used
#     previously masked failures because `rm` returns 0.)
#
# DEPENDENCY: this file consumes the base scramble from
#   /data/matrices/perms/random1D/$mtx_name.perm
# which is produced by the `random1D` job in perms_ai.yaml. Run perms_ai.yaml
# (at least its random1D job) BEFORE launching this file.
jobs:
  # - config: "perm"
  #   config_jobs:

  #     - tag: "GROOT_reorder_RANDOM"
  #       preprocess: |
  #         source include/external/Reordering-for-blocks/MtxPerm/GROOT/groot_preprocess.sh
  #         mtx_name=$(basename {mtx[suite]} .mtx)
  #         mkdir -p /data/matrices/perms_random/GROOT_reorder
  #         perm_path=/data/matrices/perms_random/GROOT_reorder/$mtx_name.perm
  #       command: >
  #         temp_mtx=$(mktemp /tmp/pre_perm_XXXXXX.mtx) &&
  #         timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/pre_permute.py {mtx[suite]} $temp_mtx
  #         --perm /data/matrices/perms/random1D/$mtx_name.perm --perm-type ROW &&
  #         timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/GROOT/reorder.py $temp_mtx $perm_path;
  #         rc=$?; rm -f $temp_mtx; (exit $rc)

  - config: "perm"
    config_jobs:

      - tag: "random1D_RANDOM"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms_random/random1D
          perm_path=/data/matrices/perms_random/random1D/$mtx_name.perm
        command: >
          temp_mtx=$(mktemp /tmp/pre_perm_XXXXXX.mtx) &&
          timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/pre_permute.py {mtx[suite]} $temp_mtx
          --perm /data/matrices/perms/random1D/$mtx_name.perm --perm-type ROW &&
          timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/RANDOM/GB_random_permutation_1d.py $temp_mtx $perm_path;
          rc=$?; rm -f $temp_mtx; (exit $rc)

      - tag: "CLUB_reorder_RANDOM"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms_random/CLUB_reorder
          perm_path=/data/matrices/perms_random/CLUB_reorder/$mtx_name.perm
        command: >
          temp_mtx=$(mktemp /tmp/pre_perm_XXXXXX.mtx) &&
          timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/pre_permute.py {mtx[suite]} $temp_mtx
          --perm /data/matrices/perms/random1D/$mtx_name.perm --perm-type ROW &&
          timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/CLUB/reorder.py $temp_mtx $perm_path --technique hybrid --w 32 --w-block 32 --lookahead 64 --hub-frac 0.05;
          rc=$?; rm -f $temp_mtx; (exit $rc)

      # - tag: "SPARTA_reorder_RANDOM"  # disabled - binary missing (see reorder.py default MtxPerm/SPARTA/repo/...)
      #   preprocess: |
