      #     --perm /data/matrices/perms/random1D/$mtx_name.perm --perm-type ROW &&
      #     timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/metis_part_perm $temp_mtx $perm_path --nparts 64;
