      # Row-only CLUB (stripe baseline, single-line .perm).
      - tag: "CLUB_reorder"
        preprocess: |
          mtx_name=$(basename {mtx} .mtx)
          mkdir -p /data/matrices/perms/CLUB_reorder
          perm_path=/data/matrices/perms/CLUB_reorder/$mtx_name.perm
        command: "python3 include/external/Reordering-for-blocks/MtxPerm/CLUB/reorder.py {mtx} $perm_path --technique stripe --bs-list 16 32"

      # Two-sided CLUB (sketch + Jaccard clustering; TWO-line .perm:
      # row perm then col perm -> evaluate with --perm-type ASYMMETRIC).
      - tag: "CLUB_jaccard"
        preprocess: |
          mtx_name=$(basename {mtx} .mtx)
          mkdir -p /data/matrices/perms/CLUB_jaccard
          perm_path=/data/matrices/perms/CLUB_jaccard/$mtx_name.perm
        command: "python3 include/external/Reordering-for-blocks/MtxPerm/CLUB/reorder.py {mtx} $perm_path --technique jaccard --bs 16 --tau 0.5 --max-iters 4"

