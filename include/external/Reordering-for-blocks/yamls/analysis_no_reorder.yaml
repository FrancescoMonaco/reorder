variables:
  suite:
    - ai
    - extended
    - standard
  mtx:
    map:
      ai: /data/matrices/datasets/ai_matrices.txt
      extended: /data/matrices/datasets/matrices_extended.txt
      standard: /data/matrices/datasets/matrices_list_filtered.txt
preprocess: |
  source ~/.venv/bin/activate
  mtx_name=$(basename {mtx[suite]} .mtx)

jobs:
  - config: "perm"
    config_jobs:
      - tag: "ANALYSIS_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/MtxPerm/ANALYSIS/analyze.py {mtx[suite]} --block-sizes 4 8 16 32 64 128"