variables:
  mtx: '/data/matrices/datasets/matrices_extended.txt'
  perm:
    - SB_gray
    - random1D
    - SB_amd
    - SB_degree
    - SB_metis
    - SB_rcm
    - SB_rabbit
    - SB_patoh
    - SB_slashburn
    - GROOT_reorder
    - CLUB_reorder
    # Two-line ASYMMETRIC .perm; ROW mode reads line 1 (row perm) only.
    - CLUB_jaccard
    - TCA_reorder
    # - ACCORDER_reorder  # disabled

preprocess: |
  source ~/.venv/bin/activate
  mtx_name=$(basename {mtx} .mtx)

jobs:
  - config: "perm"
    config_jobs:
      - tag: "ANALYSIS_ROW"
        command: "python3 include/external/Reordering-for-blocks/MtxPerm/ANALYSIS/analyze.py {mtx} --perm /data/matrices/perms/{perm}/$mtx_name.perm --perm-type ROW --block-sizes 4 8 16 32 64 128"