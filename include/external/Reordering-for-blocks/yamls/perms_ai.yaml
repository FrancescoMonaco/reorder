variables:
  suite:
    - ai
    - extended
    - standard
  mtx:
    map:
      ai: /data/matrices/datasets/ai_matrices.txt
      extended: /data/matrices/datasets/matrices_extended.txt
      standard: /data/matrices/datasets/matrices_list_filtered.txt
preprocess: |
    micromamba activate reorder_env

# NOTE (AI matrices):
#   Every reordering command below is wrapped in `timeout 30m` to impose a hard
#   30-minute wall-clock bound per matrix, because the SPRINkLE AI matrices can
#   be large. A timed-out run exits with code 124, which SbatchMan records as a
#   FAILED job in metadata.yaml.
jobs:
  # - config: "perm"
  #   config_jobs:

  #     - tag: "GROOT_reorder"
  #       preprocess: |
  #         source include/external/Reordering-for-blocks/MtxPerm/GROOT/groot_preprocess.sh
  #         mtx_name=$(basename {mtx[suite]} .mtx)
  #         mkdir -p /data/matrices/perms/GROOT_reorder
  #         perm_path=/data/matrices/perms/GROOT_reorder/$mtx_name.perm
  #       command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/GROOT/reorder.py {mtx[suite]} $perm_path"

  - config: "perm"
    config_jobs:

      - tag: "random1D"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/random1D
          perm_path=/data/matrices/perms/random1D/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/RANDOM/GB_random_permutation_1d.py {mtx[suite]} $perm_path"

      - tag: "random2D"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/random2D
          perm_path=/data/matrices/perms/random2D/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/RANDOM/GB_random_permutation_2d.py {mtx[suite]} $perm_path"

      - tag: "SB_degree"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_degree
          perm_path=/data/matrices/perms/SB_degree/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/RANDOM/GB_degree_permutation.py {mtx[suite]} $perm_path"

      - tag: "SB_gray"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_gray
          perm_path=/data/matrices/perms/SB_gray/$mtx_name.perm
        command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/gray_perm {mtx[suite]} $perm_path"

      - tag: "SB_rcm"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_rcm
          perm_path=/data/matrices/perms/SB_rcm/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/RCM/rcm_perm.py {mtx[suite]} $perm_path"

      # - tag: "SB_metis"
      #   preprocess: |
      #     mtx_name=$(basename {mtx[suite]} .mtx)
      #     mkdir -p /data/matrices/perms/SB_metis
      #     perm_path=/data/matrices/perms/SB_metis/$mtx_name.perm
      #   command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/metis_part_perm {mtx[suite]} $perm_path --nparts 64"

      # - tag: "SPARTA_reorder"  # disabled
      #   preprocess: |
      #     mtx_name=$(basename {mtx[suite]} .mtx)
      #     mkdir -p /data/matrices/perms/SPARTA_reorder
      #     perm_path=/data/matrices/perms/SPARTA_reorder/$mtx_name.perm
      #   command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/SPARTA/reorder.py {mtx[suite]} $perm_path --block-size 32 --tau 0.5"

      - tag: "SB_amd"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_amd
          perm_path=/data/matrices/perms/SB_amd/$mtx_name.perm
        command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/amd_perm {mtx[suite]} $perm_path"

      - tag: "SB_rabbit"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_rabbit
          perm_path=/data/matrices/perms/SB_rabbit/$mtx_name.perm
        command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/rabbit_perm {mtx[suite]} $perm_path"

      - tag: "SB_patoh"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_patoh
          perm_path=/data/matrices/perms/SB_patoh/$mtx_name.perm
        command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/patoh_perm {mtx[suite]} $perm_path --nparts 128"

      - tag: "SB_slashburn"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/SB_slashburn
          perm_path=/data/matrices/perms/SB_slashburn/$mtx_name.perm
        command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/SPARSEBASE/build/slashburn_perm {mtx[suite]} $perm_path"

      # Row-only CLUB (hybrid): IDF-filtered MinHash micro-clustering +
      # weighted bipartite macro-RCM + SIMD Jaccard slab packing, then always
      # apply the permutation. Single-line row perm (new -> original row).
      - tag: "CLUB_reorder"
        preprocess: |
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/CLUB_reorder
          perm_path=/data/matrices/perms/CLUB_reorder/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/CLUB/reorder.py {mtx[suite]} $perm_path --technique hybrid --w 4 --w-block 32 --lookahead 64 --hub-frac 0.05"

      # - tag: "ACCORDER_reorder"  # disabled
      #   preprocess: |
      #     source include/external/Reordering-for-blocks/MtxPerm/ACCORDER/accorder_preprocess.sh
      #     mtx_name=$(basename {mtx[suite]} .mtx)
      #     mkdir -p /data/matrices/perms/ACCORDER_reorder
      #     perm_path=/data/matrices/perms/ACCORDER_reorder/$mtx_name.perm
      #   command: "timeout 30m ./include/external/Reordering-for-blocks/MtxPerm/ACCORDER/build/accorder_perm {mtx[suite]} $perm_path"

  - config: "gpu"
    config_jobs:
      - tag: "TCA_reorder"
        preprocess: |
          source include/external/Reordering-for-blocks/MtxPerm/DTC-LSH/tca_preprocess.sh
          mtx_name=$(basename {mtx[suite]} .mtx)
          mkdir -p /data/matrices/perms/TCA_reorder
          perm_path=/data/matrices/perms/TCA_reorder/$mtx_name.perm
        command: "timeout 30m python3 include/external/Reordering-for-blocks/MtxPerm/DTC-LSH/reorder.py {mtx[suite]} $perm_path"

