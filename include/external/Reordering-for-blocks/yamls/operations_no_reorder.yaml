variables:
  mtx: '/data/matrices/datasets/matrices_list_filtered.txt'
  block_size:
    - 32
  n_cols:
    - 256

preprocess: |
  source ~/.venv/bin/activate
  mtx_name=$(basename {mtx} .mtx)


jobs:
  - config: "gpu"
    config_jobs:

      - tag: "ASPT_SPMM_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/operators/aspt_spmm.py {mtx} --n-cols {n_cols}"

#      - tag: "CUSPARSE_SPMV_BSR_NO_REORDER"
#        command: "python3 include/external/Reordering-for-blocks/operators/cusparse_bsr_spmv.py {mtx} --blocksize {block_size}"
#      - tag: "CUSPARSE_SPMV_CSR_NO_REORDER"
#        command: "python3 include/external/Reordering-for-blocks/operators/cusparse_csr_spmv.py {mtx}"

      - tag: "CUSPARSE_SPMM_BSR_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/operators/cusparse_bsr_spmm.py {mtx} --blocksize {block_size} --n-cols {n_cols}"
      - tag: "CUSPARSE_SPMM_CSR_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/operators/cusparse_csr_spmm.py {mtx} --n-cols {n_cols}"

      - tag: "SMAT_SPMM_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/operators/smat_spmm.py {mtx} --blocksize {block_size} --n-cols {n_cols}"

      - tag: "ACCSPMM_SPMM_NO_REORDER"
        command: "python3 include/external/Reordering-for-blocks/operators/accspmm_spmm.py {mtx} --n-cols {n_cols}"

      - tag: "DTC_SPMM_NO_REORDER"
        preprocess: |
          source include/external/Reordering-for-blocks/operators/dtc_preprocess.sh
          mtx_name=$(basename {mtx} .mtx)
        command: "python3 include/external/Reordering-for-blocks/operators/dtc_spmm.py {mtx} --n-cols {n_cols} --n-iterations 1"

      - tag: "FLASHSPARSE_SPMM_NO_REORDER"
        preprocess: |
          source include/external/Reordering-for-blocks/operators/flashsparse_preprocess.sh
          mtx_name=$(basename {mtx} .mtx)
        command: "python3 include/external/Reordering-for-blocks/operators/flashsparse_spmm.py {mtx} --n-cols {n_cols}"

      # - tag: "BLEST_BFS_NO_REORDER"  # disabled
      #   command: "python3 include/external/Reordering-for-blocks/operators/blest_bfs.py {mtx} --n-sources 64"